<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>WebGL pipeline pixel harness</title>
</head>
<body>
<pre id="out">running…</pre>
<script type="module">
import { WebGLImageProcessor, detectWebGL } from './webgl-bundle.js';

const out = document.getElementById('out');
const RESULTS = { info: null, tests: [], done: false, fatal: null };
window.__RESULTS = RESULTS;

function mkSource(W = 1200, H = 900, label = '') {
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const c = cv.getContext('2d');
  // 4 saturated quadrants + gradient bottom strip + grid edges
  c.fillStyle = '#e01818'; c.fillRect(0, 0, W / 2, H / 2);          // red TL
  c.fillStyle = '#18b818'; c.fillRect(W / 2, 0, W / 2, H / 2);      // green TR
  c.fillStyle = '#1840e0'; c.fillRect(0, H / 2, W / 2, H / 2);      // blue BL
  c.fillStyle = '#f0f0f0'; c.fillRect(W / 2, H / 2, W / 2, H / 2);  // white BR
  const g = c.createLinearGradient(0, 0, W, 0);
  g.addColorStop(0, '#000'); g.addColorStop(1, '#fff');
  c.globalAlpha = 0.25; c.fillStyle = g; c.fillRect(0, H * 0.85, W, H * 0.15); c.globalAlpha = 1;
  c.strokeStyle = 'rgba(255,255,255,0.35)'; c.lineWidth = 1;
  for (let x = 0; x < W; x += 8) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x, H); c.stroke(); }
  if (label) {
    c.fillStyle = '#000'; c.font = '900 ' + Math.round(W * 0.08) + 'px sans-serif';
    c.textAlign = 'center'; c.fillText(label, W / 2, H * 0.14);
  }
  return cv;
}

async function stats(blob, maxSide = 360) {
  const bmp = await createImageBitmap(blob);
  const sc = Math.min(1, maxSide / Math.max(bmp.width, bmp.height));
  const w = Math.max(2, Math.round(bmp.width * sc));
  const h = Math.max(2, Math.round(bmp.height * sc));
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const c = cv.getContext('2d', { willReadFrequently: true });
  c.drawImage(bmp, 0, 0, w, h);
  const d = c.getImageData(0, 0, w, h).data;
  let r = 0, g = 0, b = 0;
  const n = w * h;
  for (let i = 0; i < n; i++) { r += d[i*4]; g += d[i*4+1]; b += d[i*4+2]; }
  r /= n; g /= n; b /= n;
  let varr = 0;
  for (let i = 0; i < n; i++) {
    const lr = 0.2126*d[i*4] + 0.7152*d[i*4+1] + 0.0722*d[i*4+2];
    const lm = 0.2126*r + 0.7152*g + 0.0722*b;
    varr += (lr - lm) * (lr - lm);
  }
  // sample 5 points (relative coords) for hue checks
  const px = (fx, fy) => {
    const x = Math.min(w - 1, Math.max(0, Math.round(fx * w)));
    const y = Math.min(h - 1, Math.max(0, Math.round(fy * h)));
    const i = (y * w + x) * 4;
    return [d[i], d[i+1], d[i+2]];
  };
  return { w: bmp.width, h: bmp.height, mean: [r|0, g|0, b|0], std: Math.sqrt(varr / n)|0, px };
}

const BASE = { upscale: 2, aspect: 'free', denoise: true, sharpen: true, enhance: false, hdr: false, nightMode: false, vignette: false, filter: 'none', exposure: 0, contrast: 0, saturation: 0, temperature: 0 };

function run(name, fn) {
  return Promise.resolve().then(fn).then(r => ({ name, ok: true, ...r }))
    .catch(e => ({ name, ok: false, err: String(e && e.message || e) }));
}

async function suite(tag) {
  const proc = new WebGLImageProcessor();
  const T = [];

  // T1 defaults (no enhance → deterministic)
  T.push(run('T1 default 2x', async () => {
    const res = await proc.process(mkSource(1200, 900, 'T1'), { ...BASE });
    const s = await stats(res.blob);
    const ok = s.w >= 2300 && s.w <= 2500 && s.mean[0] > 15 && s.std > 10
      && s.px(0.25, 0.25)[0] > s.px(0.25, 0.25)[1]     // TL still red
      && s.px(0.75, 0.25)[1] > s.px(0.75, 0.25)[0];    // TR still green
    return { ok, dims: s.w + 'x' + s.h, mean: s.mean, std: s.std, outW: res.width };
  }));

  // T2 night mode
  T.push(run('T2 night', async () => {
    const res = await proc.process(mkSource(1200, 900, 'T2'), { ...BASE, nightMode: true });
    const s = await stats(res.blob);
    const ok = s.mean[0] + s.mean[1] + s.mean[2] > 45 && s.std > 8;
    return { ok, dims: s.w + 'x' + s.h, mean: s.mean, std: s.std };
  }));

  // T3 4x (budget clamp path)
  T.push(run('T3 upscale 4x', async () => {
    const res = await proc.process(mkSource(1200, 900, 'T3'), { ...BASE, upscale: 4 });
    const s = await stats(res.blob);
    const ok = s.w >= 4500 && s.mean[0] > 15 && s.std > 10;
    return { ok, dims: s.w + 'x' + s.h, mean: s.mean, outW: res.width };
  }));

  // T4 1:1 crop — center crop keeps middle 75% width: red center lands at x'=(0.25*1200-150)/900=0.1667
  T.push(run('T4 crop 1:1', async () => {
    const res = await proc.process(mkSource(1200, 900, 'T4'), { ...BASE, upscale: 1, aspect: '1:1' });
    const s = await stats(res.blob);
    const red = s.px(0.1667, 0.25), green = s.px(0.8333, 0.25);
    const ok = Math.abs(s.w - s.h) <= 2 && red[0] > red[1] && green[1] > green[0];
    return { ok, dims: s.w + 'x' + s.h, red, green };
  }));

  // T5 mono filter
  T.push(run('T5 mono', async () => {
    const res = await proc.process(mkSource(1200, 900, 'T5'), { ...BASE, upscale: 1, filter: 'mono' });
    const s = await stats(res.blob);
    const ok = Math.abs(s.mean[0] - s.mean[1]) < 12 && Math.abs(s.mean[1] - s.mean[2]) < 12 && s.mean[0] > 15;
    return { ok, mean: s.mean, std: s.std };
  }));

  // T6 enhance ON (autoGain active)
  T.push(run('T6 enhance', async () => {
    const res = await proc.process(mkSource(1200, 900, 'T6'), { ...BASE, enhance: true });
    const s = await stats(res.blob);
    const lum = 0.2126*s.mean[0] + 0.7152*s.mean[1] + 0.0722*s.mean[2];
    const ok = lum > 15 && lum < 245 && s.std > 8;
    return { ok, mean: s.mean, lum: lum|0 };
  }));

  // T7 heavy: phone-like 4032x3024 source, 2x — 40MP budget clamp ⇒ ~6651×4988
  T.push(run('T7 4032x3024 2x', async () => {
    const res = await proc.process(mkSource(4032, 3024, 'T7'), { ...BASE });
    const s = await stats(res.blob);
    const ok = s.w >= 6000 && s.w <= 8064 && s.mean[0] > 15 && s.std > 10;
    return { ok, dims: s.w + 'x' + s.h, mean: s.mean };
  }));

  // T8 tiny source (degenerate sizes)
  T.push(run('T8 64x64', async () => {
    const res = await proc.process(mkSource(64, 64, 'T8'), { ...BASE, upscale: 2 });
    const s = await stats(res.blob);
    const ok = s.w >= 120 && s.mean[0] > 10;
    return { ok, dims: s.w + 'x' + s.h };
  }));

  const rows = [];
  for (const pr of T) {
    const r = await pr;
    RESULTS.tests.push({ tag, ...r });
    rows.push((r.ok ? 'PASS ' : 'FAIL ') + tag + ' · ' + r.name + (r.err ? ' · ' + r.err : '') + (r.dims ? ' · ' + r.dims : '') + (r.mean ? ' · mean=' + r.mean.join(',') : ''));
  }
  return rows.join('\n');
}

try {
  RESULTS.info = detectWebGL();
  out.textContent = 'GPU: ' + (RESULTS.info.renderer || '?') + ' maxTex=' + RESULTS.info.maxTextureSize + '\n';
  out.textContent += await suite('webgl2-auto');
  // force WebGL1 path for a second suite
  const origGet = HTMLCanvasElement.prototype.getContext;
  HTMLCanvasElement.prototype.getContext = function (type, ...a) {
    if (type === 'webgl2') type = 'webgl';
    return origGet.call(this, type, ...a);
  };
  out.textContent += '\n--- webgl1 forced ---\n';
  out.textContent += await suite('webgl1');
  HTMLCanvasElement.prototype.getContext = origGet;
  RESULTS.done = true;
  out.textContent += '\nDONE';
} catch (e) {
  RESULTS.fatal = String(e && e.message || e);
  RESULTS.done = true;
  out.textContent += '\nFATAL ' + RESULTS.fatal;
}
</script>
</body>
</html>
